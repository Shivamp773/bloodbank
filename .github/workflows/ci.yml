name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Also downloads the MongoDB binary used by the API tests (no database or secrets needed).
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
